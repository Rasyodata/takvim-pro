<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Takvim Pro</title>
  <meta name="description" content="Çok kullanıcılı takvim ve iş akışı yönetimi">
  <meta name="theme-color" content="#6366f1">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Takvim Pro">
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="booting">
  <div id="boot-splash" class="boot-splash"><img src="/icons/icon.svg" alt="" width="56" height="56"><span>Yükleniyor…</span></div>
  <div id="auth-root"></div>
  <a class="skip-link" href="#view">İçeriğe geç</a>
  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Kenar çubuğu">
      <div class="brand">
        <img src="/icons/icon.svg" alt="" width="32" height="32">
        <div><div class="brand-name">Takvim Pro</div><div class="brand-sub">Ekip takvimi & iş akışı</div></div>
      </div>
      <nav class="nav" aria-label="Ana gezinme">
        <button class="nav-item" data-action="view" data-view="today" title="Bugün (1)">
          <svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg>
          <span>Bugün</span><kbd>1</kbd>
        </button>
        <button class="nav-item" data-action="view" data-view="calendar" title="Takvim (2)">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <span>Takvim</span><kbd>2</kbd>
        </button>
        <button class="nav-item" data-action="view" data-view="board" title="İş Akışı (3)">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>
          <span>İş Akışı</span><kbd>3</kbd>
        </button>
        <button class="nav-item" data-action="toggle-mine" id="mine-btn" title="Yalnızca bana atanan görevler (B)" aria-pressed="false">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span>Bana atananlar</span><span class="count" id="mine-count"></span>
        </button>
        <button class="nav-item admin-only" data-action="view" data-view="admin" title="Kullanıcı yönetimi (4)" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
          <span>Yönetim</span><kbd>4</kbd>
        </button>
      </nav>
      <div class="quick-add">
        <button class="btn btn-primary btn-block" data-action="new-event" title="Yeni etkinlik (N)">+ Etkinlik</button>
        <button class="btn btn-soft btn-block" data-action="new-task" title="Yeni görev (G)">+ Görev</button>
      </div>
      <section class="side-section">
        <div class="side-head"><span>Projeler</span><button class="icon-btn sm" data-action="new-project" title="Yeni proje" aria-label="Yeni proje">+</button></div>
        <ul class="side-list" id="project-list"></ul>
      </section>
      <section class="side-section">
        <div class="side-head"><span>Etiketler</span></div>
        <div class="tag-cloud" id="tag-list"></div>
      </section>
      <div class="side-footer">
        <button class="side-link" data-action="toggle-theme" id="theme-btn">🌙 Koyu tema</button>
        <button class="side-link" data-action="export">⬇️ Verilerimi dışa aktar (JSON)</button>
        <button class="side-link" data-action="shortcuts">⌨️ Klavye kısayolları</button>
      </div>
    </aside>
    <div class="sidebar-backdrop" data-action="close-sidebar"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="open-sidebar" aria-label="Menüyü aç"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <h1 class="page-title" id="page-title">Bugün</h1>
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="search" placeholder="Ara…  ( / )" aria-label="Etkinlik ve görevlerde ara" autocomplete="off">
        </div>
        <div class="filters" id="active-filters"></div>
        <div class="user-menu" id="user-menu">
          <button class="user-btn" data-action="user-menu" aria-haspopup="true" aria-expanded="false" id="user-btn"></button>
          <div class="user-dropdown" id="user-dropdown" hidden role="menu"></div>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
